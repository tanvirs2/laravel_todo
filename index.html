<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aquarium Vibe — Slow water, kept well.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --abyss: #030814; --deep: #061226; --night: #0a1a36; --ocean: #102a52;
  --tide: #1d4078; --current: #356fb3; --shallow: #6ba7d6; --foam: #b8d6e8;
  --pearl: #e8f0f5; --ivory: #f6f1e4; --sand: #d8c9a3; --coral: #e9a373;
  --rust: #c8623d; --kelp: #2e6b5f;
  --serif: "Cormorant Garamond","Times New Roman",serif;
  --sans:  "Manrope",ui-sans-serif,system-ui,sans-serif;
  --mono:  "JetBrains Mono",ui-monospace,monospace;
  --ease:  cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--abyss);color:var(--pearl);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── Ambient layers ── */
.ocean-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(53,111,179,.35) 0%,transparent 60%),
             radial-gradient(ellipse 100% 60% at 20% 30%,rgba(29,64,120,.4) 0%,transparent 50%),
             radial-gradient(ellipse 90% 70% at 80% 60%,rgba(16,42,82,.5) 0%,transparent 55%),
             linear-gradient(180deg,var(--deep) 0%,var(--abyss) 100%)}
.caustics{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.12;mix-blend-mode:screen;
  background:radial-gradient(circle at 20% 30%,rgba(180,220,255,.6) 0%,transparent 8%),
             radial-gradient(circle at 70% 20%,rgba(180,220,255,.5) 0%,transparent 6%),
             radial-gradient(circle at 40% 70%,rgba(180,220,255,.5) 0%,transparent 7%),
             radial-gradient(circle at 85% 80%,rgba(180,220,255,.6) 0%,transparent 9%),
             radial-gradient(circle at 10% 90%,rgba(180,220,255,.4) 0%,transparent 5%);
  animation:caustic-drift 20s ease-in-out infinite}
@keyframes caustic-drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(2%,-3%) scale(1.05)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.08;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.bubbles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bubble{position:absolute;bottom:-40px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.6),rgba(184,214,232,.18) 50%,transparent 70%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translate(var(--drift,30px),-110vh);opacity:0}}

/* ── Layout ── */
.page{position:relative;z-index:2}

/* ── Nav ── */
.nav{position:sticky;top:0;z-index:50;padding:22px 48px;
  display:flex;align-items:center;justify-content:space-between;
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  background:linear-gradient(180deg,rgba(3,8,20,.5),rgba(3,8,20,.15));
  border-bottom:.5px solid rgba(184,214,232,.08)}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.01em;font-style:italic}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);display:inline-block}
.brand small{font-family:var(--sans);font-size:9px;font-weight:600;font-style:normal;letter-spacing:.25em;text-transform:uppercase;color:var(--shallow);opacity:.7}
.nav-links{display:flex;gap:36px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.nav-links a{opacity:.8;transition:opacity .2s}.nav-links a:hover{opacity:1;color:var(--foam)}
.nav-tools{display:flex;align-items:center;gap:24px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.cart-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:.5px solid rgba(184,214,232,.2);transition:all .2s var(--ease)}
.cart-btn:hover{border-color:var(--coral);background:rgba(233,163,115,.08)}
.cart-count{background:var(--coral);color:var(--abyss);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;letter-spacing:0}

/* ── Hero Banner ── */
.hero-banner{position:relative;width:100%;min-height:580px;overflow:hidden;
  background:linear-gradient(160deg,var(--deep) 0%,var(--abyss) 55%,#040a18 100%)}
.hb-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--serif);font-size:clamp(64px,14vw,210px);font-weight:700;letter-spacing:.08em;
  color:rgba(184,214,232,.028);white-space:nowrap;pointer-events:none;user-select:none;
  text-transform:uppercase;z-index:0}
.hb-glow{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
  width:560px;height:440px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(53,111,179,.3) 0%,rgba(29,64,120,.14) 45%,transparent 72%);
  pointer-events:none;z-index:1}
.hb-art{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:3;width:540px;
  animation:hb-float 7s ease-in-out infinite}
@keyframes hb-float{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1.2deg)}50%{transform:translateX(-50%) translateY(-18px) rotate(1.2deg)}}
.hb-fish{width:100%;height:auto;filter:drop-shadow(0 0 40px rgba(107,167,214,.32))}
.hb-bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:flex-end;padding:0 52px 36px;z-index:2;pointer-events:none}
.hb-tag-sm{display:block;font-family:var(--sans);font-size:10px;font-weight:700;
  letter-spacing:.32em;text-transform:uppercase;color:var(--coral);margin-bottom:4px}
.hb-headline{display:block;font-family:var(--serif);font-size:clamp(56px,9vw,128px);
  font-weight:700;line-height:.86;letter-spacing:-.02em;text-transform:uppercase;color:var(--ivory)}
.hb-subline{display:block;font-family:var(--serif);font-size:clamp(28px,4.5vw,64px);
  font-weight:300;line-height:.92;letter-spacing:-.01em;text-transform:uppercase;color:rgba(246,241,228,.6)}
.hb-right-text{text-align:right}
.hb-dots{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:4}
.hb-dot{width:8px;height:8px;border-radius:50%;background:rgba(184,214,232,.28);cursor:pointer;transition:all .35s var(--ease)}
.hb-dot.active{width:28px;border-radius:999px;background:var(--coral)}

/* ── Fish animations ── */
.fish-tail{transform-box:fill-box;transform-origin:right center;animation:fish-tailwag 1.7s ease-in-out infinite}
@keyframes fish-tailwag{0%,100%{transform:rotate(0deg)}28%{transform:rotate(12deg)}72%{transform:rotate(-12deg)}}
.fish-dorsal{transform-box:fill-box;transform-origin:bottom center;animation:fish-dorsalsway 2.6s ease-in-out infinite;animation-delay:-.9s}
@keyframes fish-dorsalsway{0%,100%{transform:skewX(0deg) translateX(0)}50%{transform:skewX(6deg) translateX(3px)}}
.fish-pectoral{transform-box:fill-box;transform-origin:top left;animation:fish-pect 1.25s ease-in-out infinite;animation-delay:-.3s}
@keyframes fish-pect{0%,100%{transform:rotate(0deg)}50%{transform:rotate(20deg)}}
.fish-ventral{transform-box:fill-box;transform-origin:top center;animation:fish-ventfin 1.55s ease-in-out infinite;animation-delay:-.65s}
@keyframes fish-ventfin{0%,100%{transform:rotate(0deg)}50%{transform:rotate(9deg)}}

/* ── Promo Strip ── */
.promo-strip{display:grid;grid-template-columns:repeat(3,1fr);
  border-top:.5px solid rgba(184,214,232,.1);border-bottom:.5px solid rgba(184,214,232,.1)}
.promo-card{display:flex;align-items:center;gap:18px;padding:18px 28px;min-height:90px;
  border-right:.5px solid rgba(184,214,232,.1);cursor:pointer;transition:opacity .2s}
.promo-card:last-child{border-right:none}.promo-card:hover{opacity:.82}
.promo-num{font-family:var(--serif);font-size:48px;font-weight:700;line-height:1;color:var(--coral);flex-shrink:0}
.promo-lbl{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ivory)}
.promo-sub{font-size:11px;color:var(--shallow);letter-spacing:.06em;margin-top:3px}

/* ── Style Spotlight ── */
.spotlight-section{padding:96px 48px;max-width:1440px;margin:0 auto;display:grid;
  grid-template-columns:1.15fr 1fr;gap:72px;align-items:center;
  border-bottom:.5px solid rgba(184,214,232,.07)}
.spotlight-art{position:relative;aspect-ratio:5/4;width:100%;
  background:radial-gradient(ellipse at 50% 55%,#0c1830 0%,#040912 75%);
  border-radius:2px;overflow:hidden;border:.5px solid rgba(184,214,232,.06);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.6), inset 0 0 80px rgba(0,0,0,.4)}
.spotlight-art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.spotlight-watermark{position:absolute;left:24px;bottom:18px;font-family:var(--sans);
  font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:rgba(184,214,232,.32);z-index:2}
.spotlight-tag{display:inline-flex;align-items:center;gap:14px;font-family:var(--sans);
  font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--coral);margin-bottom:28px}
.spotlight-tag::before{content:"";width:32px;height:1px;background:var(--coral)}
.spotlight-head{font-family:var(--serif);font-size:clamp(40px,5.2vw,68px);font-weight:600;
  line-height:1.02;letter-spacing:-.015em;color:var(--ivory);margin:0 0 28px}
.spotlight-head em{font-style:italic;color:var(--coral);font-weight:500}
.spotlight-body{font-size:15px;line-height:1.7;color:var(--foam);opacity:.82;max-width:480px;margin:0 0 36px}
.spotlight-credits{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 32px;
  padding-top:30px;border-top:.5px solid rgba(184,214,232,.1);max-width:480px}
.spotlight-credit-lbl{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--shallow);margin-bottom:6px;opacity:.85}
.spotlight-credit-val{font-family:var(--serif);font-size:19px;color:var(--ivory);font-style:italic;font-weight:500}
.spotlight-cta{display:inline-flex;align-items:center;gap:14px;margin-top:38px;
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.28em;
  text-transform:uppercase;color:var(--coral);cursor:pointer;background:transparent;
  border:none;padding:0;transition:gap .25s ease}
.spotlight-cta:hover{gap:20px}
.spotlight-cta-arrow{width:34px;height:1px;background:var(--coral);transition:width .25s ease}
.spotlight-cta:hover .spotlight-cta-arrow{width:46px}

@keyframes sp-beam{0%,100%{opacity:.62}50%{opacity:.92}}
@keyframes sp-fish-r{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@keyframes sp-fish-l{0%,100%{transform:translateX(0)}50%{transform:translateX(-18px)}}
@keyframes sp-bub{0%{transform:translateY(0);opacity:.6}100%{transform:translateY(-180px);opacity:0}}
.sp-beam-l{animation:sp-beam 4.2s ease-in-out infinite}
.sp-beam-r{animation:sp-beam 4.2s ease-in-out infinite;animation-delay:-2.1s}
.sp-fish-a{transform-box:fill-box;transform-origin:center;animation:sp-fish-r 5.4s ease-in-out infinite}
.sp-fish-b{transform-box:fill-box;transform-origin:center;animation:sp-fish-l 6.2s ease-in-out infinite;animation-delay:-1.4s}
.sp-fish-c{transform-box:fill-box;transform-origin:center;animation:sp-fish-r 4.9s ease-in-out infinite;animation-delay:-2.6s}
.sp-bub{transform-box:fill-box;animation:sp-bub 5s linear infinite}
.sp-bub-2{animation-delay:-1.7s}
.sp-bub-3{animation-delay:-3.3s}

@media (max-width:900px){
  .spotlight-section{grid-template-columns:1fr;gap:44px;padding:64px 22px}
  .spotlight-credits{grid-template-columns:1fr 1fr;gap:18px}
}

/* ── Shop Sections ── */
.shop-section{padding:72px 48px;max-width:1440px;margin:0 auto}
.shop-section+.shop-section{border-top:.5px solid rgba(184,214,232,.07)}
.section-rule{width:38px;height:3px;background:var(--coral);margin:0 auto 16px;border-radius:999px}
.shop-section-title{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ivory);text-align:center}
.shop-section-sub{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--shallow);opacity:.7;margin-top:7px;margin-bottom:42px}

/* ── Product Grid ── */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

/* ── Product Card ── */
.pcard{display:flex;flex-direction:column}
.pcard-img{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;
  border:.5px solid rgba(184,214,232,.1);margin-bottom:12px;cursor:pointer;
  transition:border-color .3s var(--ease)}
.pcard-img:hover{border-color:rgba(233,163,115,.4)}
.pcard-badge{position:absolute;top:10px;left:10px;z-index:2;background:var(--coral);color:var(--abyss);
  font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;line-height:1.3;text-align:center}
.pcard-glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pcard-glyph svg{width:60%;height:60%;opacity:.62}
.pcard-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.pcard-img:hover .pcard-photo{transform:scale(1.04)}
.pcard-photo-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(3,8,20,0.45) 100%);pointer-events:none}
.pcard-add-btn{position:absolute;bottom:10px;right:10px;width:34px;height:34px;border-radius:50%;
  background:var(--ivory);color:var(--abyss);display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(6px);transition:all .25s var(--ease);z-index:3}
.pcard:hover .pcard-add-btn{opacity:1;transform:translateY(0)}
.pcard-add-btn:hover{background:var(--coral)}
.pcard-add-btn.added{background:var(--kelp);color:var(--ivory);opacity:1;transform:none}
.pcard-add-btn svg{width:14px;height:14px}
.pcard-sizes{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.psize{font-size:10px;color:var(--shallow);padding:3px 7px;border:.5px solid rgba(184,214,232,.2);
  border-radius:2px;letter-spacing:.04em;cursor:pointer;transition:all .15s}
.psize:hover{border-color:var(--shallow);color:var(--foam)}
.psize.sel{border-color:var(--coral);color:var(--coral)}
.pcard-name{font-family:var(--serif);font-size:18px;font-weight:400;color:var(--ivory);line-height:1.2;margin-bottom:4px}
.pcard-meta{font-size:11px;color:var(--shallow);opacity:.72;letter-spacing:.04em;margin-bottom:7px}
.pcard-prices{display:flex;align-items:baseline;gap:10px}
.pcard-orig{font-size:12px;color:var(--shallow);text-decoration:line-through;opacity:.65}
.pcard-sale{font-family:var(--serif);font-size:21px;color:var(--coral)}

/* ── Shop All ── */
.shop-all-row{display:flex;justify-content:center;margin-top:38px}
.btn-shop-all{display:inline-flex;align-items:center;gap:8px;padding:13px 30px;
  border:.5px solid rgba(184,214,232,.3);border-radius:2px;
  font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--foam);cursor:pointer;transition:all .25s var(--ease);background:none}
.btn-shop-all:hover{border-color:var(--coral);color:var(--coral)}
.btn-shop-all svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.btn-shop-all:hover svg{transform:translateX(4px)}

/* ── Btns ── */
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:999px;
  font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  transition:all .25s var(--ease)}
.btn-primary{background:var(--ivory);color:var(--abyss)}
.btn-primary:hover{background:var(--coral);transform:translateY(-1px)}
.btn-ghost{border:.5px solid rgba(184,214,232,.3);color:var(--pearl)}
.btn-ghost:hover{border-color:var(--coral);color:var(--coral)}
.btn .arrow{transition:transform .25s var(--ease)}.btn:hover .arrow{transform:translateX(4px)}

/* ── Newsletter ── */
.newsletter{padding:140px 48px;text-align:center;max-width:760px;margin:0 auto}
.newsletter h2{font-family:var(--serif);font-weight:300;font-size:clamp(40px,5vw,64px);
  line-height:1;letter-spacing:-.01em;color:var(--ivory)}
.newsletter h2 em{font-style:italic;color:var(--coral);font-weight:400}
.newsletter p{margin-top:20px;color:var(--foam);opacity:.85;font-size:16px}
.news-form{margin-top:36px;display:flex;gap:8px;background:rgba(184,214,232,.06);
  border:.5px solid rgba(184,214,232,.18);border-radius:999px;padding:6px 6px 6px 24px;
  max-width:480px;margin-left:auto;margin-right:auto}
.news-form input{flex:1;background:transparent;border:0;outline:none;font:inherit;color:var(--ivory)}
.news-form input::placeholder{color:var(--shallow);opacity:.7}
.news-form button{padding:12px 22px;border-radius:999px;background:var(--ivory);color:var(--abyss);
  font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:all .2s}
.news-form button:hover{background:var(--coral)}

/* ── Footer ── */
.foot{padding:80px 48px 40px;border-top:.5px solid rgba(184,214,232,.1);max-width:1440px;margin:0 auto}
.foot-3col{display:grid;grid-template-columns:repeat(3,1fr);gap:56px;margin-bottom:48px}
.foot-section-title{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ivory);padding-bottom:10px;
  border-bottom:2px solid var(--coral);margin-bottom:22px}
.foot-links{list-style:none;display:flex;flex-direction:column;gap:10px}
.foot-links a{font-size:13px;color:var(--foam);opacity:.75;transition:all .2s}
.foot-links a:hover{opacity:1;color:var(--coral)}
.btn-community{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;margin:14px 0 20px;
  background:var(--coral);color:var(--abyss);border-radius:4px;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s;border:none}
.btn-community:hover{background:var(--rust)}
.social-row{display:flex;gap:10px;margin-top:4px}
.social-ico{width:32px;height:32px;border-radius:50%;border:.5px solid rgba(184,214,232,.22);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  color:var(--foam);cursor:pointer;transition:all .2s}
.social-ico:hover{border-color:var(--coral);color:var(--coral)}
.foot-meta{display:flex;justify-content:space-between;padding-top:28px;
  border-top:.5px solid rgba(184,214,232,.08);font-size:12px;color:var(--shallow);opacity:.7}

/* ── Cart Drawer ── */
.cart-overlay{position:fixed;inset:0;z-index:99;background:rgba(3,8,20,.7);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.cart-overlay.open{opacity:1;pointer-events:auto}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;width:460px;z-index:100;
  background:linear-gradient(180deg,var(--deep),var(--abyss));
  border-left:.5px solid rgba(184,214,232,.15);
  transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column}
.cart-drawer.open{transform:translateX(0)}
.cart-hd{padding:26px 28px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:.5px solid rgba(184,214,232,.1)}
.cart-hd h3{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--ivory)}
.cart-hd h3 small{font-size:13px;color:var(--shallow);margin-left:8px;letter-spacing:.1em}
.cart-close{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .2s}
.cart-close:hover{background:rgba(184,214,232,.08)}
.cart-body{flex:1;overflow-y:auto;padding:12px 28px}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;

.cart-item{display:grid;grid-template-columns:80px 1fr auto;gap:16px;

.cart-item-remove{font-size:11px;color:var(--shallow);letter-spacing:.1em;text-transform:uppercase;transition:color .15s}

.cart-checkout:hover{background:var(--coral)}
.cart-secure{text-align:center;font-size:11px;color:var(--shallow);margin-top:12px;letter-spacing:.1em;opacity:.7}

/* ── Checkout ── */
.checkout-veil{position:fixed;inset:0;z-index:200;background:rgba(3,8,20,.96);backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);overflow-y:auto}
.checkout-veil.open{opacity:1;pointer-events:auto}
.checkout-card{width:100%;max-width:880px;margin:60px auto;background:var(--deep);
  border:.5px solid rgba(184,214,232,.15);border-radius:4px;padding:48px 56px;position:relative}
.checkout-close{position:absolute;top:20px;right:20px;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  border:.5px solid rgba(184,214,232,.18)}
.checkout-close:hover{background:rgba(184,214,232,.08)}

  text-transform:uppercase;color:var(--shallow)}

  line-height:1;margin-bottom:8px;letter-spacing:-.01em}

.field input:focus{border-color:var(--coral)}

.checkout-cta{margin-top:28px;display:flex;align-items:center;gap:16px}

.confirm-icn{width:80px;height:80px;border-radius:50%;margin:0 auto 28px;

.confirm-icn::after{content:"";position:absolute;inset:-8px;border-radius:50%;

@keyframes pulse-ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.4);opacity:0}}
.confirm-icn svg{width:40px;height:40px;color:var(--coral)}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);z-index:150;

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

    case "tank":        return <svg viewBox="0 0 100 100" className={className}><rect x="14" y="22" width="72" height="56" rx="2" {...s}/><path d="M14 64 Q35 60 50 64 T86 64" {...s}/><ellipse cx="60" cy="50" rx="8" ry="4" {...s}/><path d="M52 50 L46 47 L46 53 Z" {...s}/><circle cx="30" cy="34" r=".8" fill="currentColor"/><circle cx="32" cy="40" r=".6" fill="currentColor"/></svg>;
    case "tank-wide":   return <svg viewBox="0 0 100 100" className={className}><rect x="8" y="30" width="84" height="42" rx="1.5" {...s}/><path d="M8 60 Q30 56 50 60 T92 60" {...s}/><ellipse cx="65" cy="46" rx="6" ry="3" {...s}/><path d="M59 46 L55 44 L55 48 Z" {...s}/></svg>;
    case "setup":       return <svg viewBox="0 0 100 100" className={className}><rect x="16" y="20" width="68" height="50" rx="2" {...s}/><rect x="20" y="74" width="60" height="8" rx="1" {...s}/><path d="M20 62 Q35 58 50 62 T80 62" {...s}/><circle cx="50" cy="46" r="5" {...s}/></svg>;
    case "plant":       return <svg viewBox="0 0 100 100" className={className}><path d="M50 84 Q42 60 38 40 Q42 50 50 56 Q58 50 62 40 Q58 60 50 84" {...s}/><path d="M50 84 Q34 70 30 56" {...s}/><path d="M50 84 Q66 70 70 56" {...s}/></svg>;
    case "plant-carpet":return <svg viewBox="0 0 100 100" className={className}><path d="M20 78 Q24 64 28 78 Q32 64 36 78 Q40 64 44 78 Q48 64 52 78 Q56 64 60 78 Q64 64 68 78 Q72 64 76 78 Q80 64 84 78" {...s}/><path d="M14 86 L86 86" {...s}/></svg>;
    case "driftwood":   return <svg viewBox="0 0 100 100" className={className}><path d="M14 60 Q30 52 42 58 Q56 64 70 56 Q82 50 90 56" {...s}/><path d="M30 56 L24 44" {...s}/><path d="M50 60 L46 48" {...s}/><path d="M68 56 L74 42" {...s}/></svg>;

    case "led":         return <svg viewBox="0 0 100 100" className={className}><rect x="14" y="30" width="72" height="8" rx="3" {...s}/><path d="M22 38 L22 50 M34 38 L34 56 M46 38 L46 50 M58 38 L58 56 M70 38 L70 50 M78 38 L78 56" {...s}/></svg>;

};

// ── Bubbles ──────────────────────────────────────────────────────────
function Bubbles({ show, intensity }) {
  if (!show) return null;
  const count = intensity==="still"?12:intensity==="calm"?22:36;
  const speed = intensity==="still"?28:intensity==="calm"?18:11;
  const bubbles = useMemo(()=>Array.from({length:count},()=>({
    left:Math.random()*100, size:4+Math.random()*14,
    delay:Math.random()*speed, duration:speed+Math.random()*12,
    drift:(Math.random()-.5)*80, opacity:.3+Math.random()*.5
  })),[count,speed]);
  return (
    <div className="bubbles" aria-hidden="true">
      {bubbles.map((b,i)=>(
        <span key={i} className="bubble" style={{
          left:b.left+"%", width:b.size+"px", height:b.size+"px",
          animationDelay:-b.delay+"s", animationDuration:b.duration+"s",
          opacity:b.opacity, "--drift":b.drift+"px"
        }}/>
      ))}
    </div>
  );
}

// ── Hero Banner ──────────────────────────────────────────────────────
function HeroBanner() {

// ── Cart ─────────────────────────────────────────────────────────────
function useCart() {
  const [items,setItems]=useState([]);
  const [open,setOpen]=useState(false);
  const add=(p,qty=1)=>setItems(prev=>{const f=prev.find(i=>i.id===p.id);return f?prev.map(i=>i.id===p.id?{...i,qty:i.qty+qty}:i):[...prev,{...p,qty}]});
  const remove=(id)=>setItems(prev=>prev.filter(i=>i.id!==id));
  const setQty=(id,qty)=>{if(qty<=0)return remove(id);setItems(prev=>prev.map(i=>i.id===id?{...i,qty}:i))};
  const clear=()=>setItems([]);
  const count=items.reduce((s,i)=>s+i.qty,0);
  const subtotal=items.reduce((s,i)=>s+i.price*i.qty,0);
  return{items,open,setOpen,add,remove,setQty,clear,count,subtotal};
}

          <div className="checkout-summary"><span>Total due now</span><span className="price">${total.toLocaleString()}</span></div>
        </>}
        {step===2&&(
          <div style={{textAlign:"center",padding:"20px 0 8px"}}>
            <div className="confirm-icn"><Glyph name="check"/></div>
            <h3>Your tank is <em>on its way</em>.</h3>
            <p className="lead" style={{maxWidth:480,margin:"12px auto 0"}}>
              Order #AV-{Math.floor(Math.random()*90000+10000)} confirmed. Your specialist will be in touch.
            </p>
            <div style={{display:"flex",gap:40,justifyContent:"center",marginTop:36,fontSize:13}}>
              <div><div style={{fontFamily:"var(--serif)",fontSize:22,color:"var(--ivory)"}}>Tue, Jun 2</div><div style={{color:"var(--shallow)",fontSize:11,letterSpacing:".15em",textTransform:"uppercase",marginTop:4}}>Estimated arrival</div></div>
              <div><div style={{fontFamily:"var(--serif)",fontSize:22,color:"var(--ivory)"}}>${total.toLocaleString()}</div><div style={{color:"var(--shallow)",fontSize:11,letterSpacing:".15em",textTransform:"uppercase",marginTop:4}}>Charged</div></div>
              <div><div style={{fontFamily:"var(--serif)",fontSize:22,color:"var(--ivory)"}}>Marcus L.</div><div style={{color:"var(--shallow)",fontSize:11,letterSpacing:".15em",textTransform:"uppercase",marginTop:4}}>Your specialist</div></div>
            </div>
            <div style={{marginTop:36}}><button className="btn btn-primary" onClick={()=>{cart.clear();onClose()}}>Continue browsing</button></div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Product Card ─────────────────────────────────────────────────────
const CARD_BG={
  tanks:"linear-gradient(158deg,#0d2545,#040e1c)",
  fish:"linear-gradient(158deg,#0b2235,#051018)",
  plants:"linear-gradient(158deg,#0a1e18,#030f0c)",
  equipment:"linear-gradient(158deg,#141828,#0a0d1a)",
  setup:"linear-gradient(158deg,#1a1228,#0a0812)"
};
function ProductCard({product,onAdd}) {
  const [added,setAdded]=useState(false);
  const [selSize,setSelSize]=useState(0);
  const handle=(e)=>{e.stopPropagation();onAdd(product);setAdded(true);setTimeout(()=>setAdded(false),1200)};
  return (
    <div className="pcard">
      <div className="pcard-img" style={{background:CARD_BG[product.cat]||CARD_BG.tanks}}>
        {product.photo
          ? <><img className="pcard-photo" src={product.photo} alt={product.name} loading="lazy"/><div className="pcard-photo-overlay"/></>
          : <div className="pcard-glyph"><Glyph name={product.glyph}/></div>
        }
        {product.discount&&<div className="pcard-badge">{product.discount}%<br/>off</div>}
        <button className={"pcard-add-btn"+(added?" added":"")} onClick={handle}>
          <Glyph name={added?"check":"plus"}/>
        </button>
      </div>
      <div className="pcard-sizes">
        {product.sizes.map((s,i)=>(
          <span key={i} className={"psize"+(selSize===i?" sel":"")} onClick={()=>setSelSize(i)}>{s}</span>
        ))}
      </div>
      <div className="pcard-name">{product.name}</div>
      <div className="pcard-meta">{product.meta}</div>
      <div className="pcard-prices">
        <span className="pcard-orig">${product.originalPrice}</span>
        <span className="pcard-sale">${product.price}</span>
      </div>
    </div>
  );
}

// ── Product Section ───────────────────────────────────────────────────
function ProductSection({title,subtitle,products,id,onAdd}) {
  return (
    <section className="shop-section" id={id}>
      <div style={{textAlign:"center",marginBottom:42}}>
        <div className="section-rule"/>
        <div className="shop-section-title">{title}</div>
        {subtitle&&<div className="shop-section-sub">{subtitle}</div>}
      </div>
      <div className="pgrid">{products.map(p=><ProductCard key={p.id} product={p} onAdd={onAdd}/>)}</div>
      <div className="shop-all-row">
        <button className="btn-shop-all">Shop All <Glyph name="arrow"/></button>
      </div>
    </section>
  );
}

// ── Tweaks ────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS={palette:["#030814","#e9a373","#f6f1e4"],motion:"calm",showBubbles:true};
const PALETTES={
  "030814":{abyss:"#030814",deep:"#061226",coral:"#e9a373",ivory:"#f6f1e4",current:"#356fb3",shallow:"#6ba7d6",foam:"#b8d6e8",pearl:"#e8f0f5"},
  "0c1d18":{abyss:"#0c1d18",deep:"#13302a",coral:"#d8c2a0",ivory:"#efe8d6",current:"#5a8e72",shallow:"#8eb59c",foam:"#c8dccb",pearl:"#e0ebde"},
  "1a0e1f":{abyss:"#1a0e1f",deep:"#2a1730",coral:"#e89bd4",ivory:"#f4e8ed",current:"#a774b8",shallow:"#c4a3d0",foam:"#d8c6dd",pearl:"#ebe1ef"},
  "f4eee2":{abyss:"#f4eee2",deep:"#e8e0cf",coral:"#c66d3f",ivory:"#1a1410",current:"#2a4d6e",shallow:"#4a6b85",foam:"#3d5570",pearl:"#1a1410"}
};
function useTweaks(d){const [v,sv]=useState(d);const set=(k,val)=>sv(p=>({...p,[k]:val}));return[v,set]}

function TweaksUI({t,setTweak,open,setOpen}) {
  if(!open) return <button className="twk-btn-open" onClick={()=>setOpen(true)}>Tweaks</button>;
  const pKey=t.palette[0].replace("#","");
  const motionOpts=["still","calm","active"];
  const mIdx=motionOpts.indexOf(t.motion);
  return (
    <div className="twk-panel">
      <div className="twk-hd"><b>Tweaks</b><button className="twk-x" onClick={()=>setOpen(false)}>✕</button></div>
      <div className="twk-body">
        <div className="twk-sect">Palette</div>
        <div className="twk-row"><div className="twk-lbl"><span>Theme</span></div>
          <div className="twk-chips">
            {[["#030814","#e9a373","#f6f1e4"],["#0c1d18","#d8c2a0","#efe8d6"],["#1a0e1f","#e89bd4","#f4e8ed"],["#f4eee2","#c66d3f","#1a1410"]].map((o,i)=>(
              <button key={i} className="twk-chip" data-on={JSON.stringify(t.palette)===JSON.stringify(o)?"1":"0"}
                style={{background:o[0]}} onClick={()=>setTweak("palette",o)}>
                <span><i style={{background:o[1]}}/><i style={{background:o[2]}}/></span>
              </button>
            ))}
          </div>
        </div>
        <div className="twk-sect">Atmosphere</div>
        <div className="twk-row"><div className="twk-lbl"><span>Motion</span></div>
          <div className="twk-seg">
            <div className="twk-seg-thumb" style={{left:`calc(2px + ${mIdx} * (100% - 4px) / 3)`,width:"calc((100% - 4px) / 3)"}}/>
            {motionOpts.map(o=><button key={o} onClick={()=>setTweak("motion",o)}>{o}</button>)}
          </div>
        </div>
        <div className="twk-row twk-row-h">
          <div className="twk-lbl"><span>Bubbles</span></div>
          <button className="twk-toggle" data-on={t.showBubbles?"1":"0"} onClick={()=>setTweak("showBubbles",!t.showBubbles)}><i/></button>
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────

            <input type="email" placeholder="your@email.com" required/>

        </section>

        {/* Footer */}
        <footer className="foot">
          <div className="foot-3col">

              <div className="foot-section-title">About Us</div>
              <p style={{fontSize:14,color:"var(--foam)",opacity:.75,lineHeight:1.65,maxWidth:300}}>
                Aquarium Vibe is a premium aquatics shop for the patient hobbyist. We source, quarantine, and deliver the finest glass tanks, live fish, and aquatic plants to your door.
              </p>
              <div style={{marginTop:18,display:"flex",flexDirection:"column",gap:8}}>
                <a href="#" style={{fontSize:13,color:"var(--shallow)",opacity:.8}}>Contact Us</a>
                <a href="#" style={{fontSize:13,color:"var(--shallow)",opacity:.8}}>Career</a>
                <a href="#" style={{fontSize:13,color:"var(--shallow)",opacity:.8}}>Outlet</a>
              </div>
            </div>
            <div>
              <div className="foot-section-title">Policy</div>
              <ul className="foot-links">
                <li><a href="#">Care Guarantee</a></li>
                <li><a href="#">Exchange &amp; Returns</a></li>
                <li><a href="#">Shipping Policy</a></li>
                <li><a href="#">Privacy Policy</a></li>
                <li><a href="#">Terms &amp; Conditions</a></li>
              </ul>
            </div>
            <div>
              <div className="foot-section-title">Connect With Us</div>

                Join the Aquarium Vibe community — aquascaping tips, livestock photos, and weekly deals.
              </p>
              <button className="btn-community">Join Our Discord Community</button>
              <div className="social-row">

                <div className="social-ico">FB</div><div className="social-ico">TW</div>
              </div>

          </div>
          <div className="foot-meta">

          </div>
        </footer>
      </div>

      <CartDrawer cart={cart} onCheckout={()=>{cart.setOpen(false);setCheckoutOpen(true)}}/>

      <div className={"toast"+(toast?" show":"")}>
        <Glyph name="check"/><span>{toast}</span>
      </div>

      <TweaksUI t={t} setTweak={setTweak} open={tweakOpen} setOpen={setTweakOpen}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
