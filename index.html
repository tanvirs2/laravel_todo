<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aquarium Vibe — Slow water, kept well.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Aquarium Vibe — serene premium underwater commerce */

:root {
  --abyss: #030814;
  --deep: #061226;
  --night: #0a1a36;
  --ocean: #102a52;
  --tide: #1d4078;
  --current: #356fb3;
  --shallow: #6ba7d6;
  --foam: #b8d6e8;
  --pearl: #e8f0f5;
  --ivory: #f6f1e4;
  --sand: #d8c9a3;
  --coral: #e9a373;
  --rust: #c8623d;
  --kelp: #2e6b5f;

  --serif: "Cormorant Garamond", "Times New Roman", serif;
  --sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;

  --ease: cubic-bezier(.2,.7,.2,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--abyss);
  color: var(--pearl);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; max-width: 100%; }

/* ─── Underwater background ─── */
.ocean-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(53,111,179,.35) 0%, transparent 60%),
    radial-gradient(ellipse 100% 60% at 20% 30%, rgba(29,64,120,.4) 0%, transparent 50%),
    radial-gradient(ellipse 90% 70% at 80% 60%, rgba(16,42,82,.5) 0%, transparent 55%),
    linear-gradient(180deg, var(--deep) 0%, var(--abyss) 100%);
}

.caustics {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: .12; mix-blend-mode: screen;
  background:
    radial-gradient(circle at 20% 30%, rgba(180,220,255,.6) 0%, transparent 8%),
    radial-gradient(circle at 70% 20%, rgba(180,220,255,.5) 0%, transparent 6%),
    radial-gradient(circle at 40% 70%, rgba(180,220,255,.5) 0%, transparent 7%),
    radial-gradient(circle at 85% 80%, rgba(180,220,255,.6) 0%, transparent 9%),
    radial-gradient(circle at 10% 90%, rgba(180,220,255,.4) 0%, transparent 5%);
  animation: caustic-drift 20s ease-in-out infinite;
}
@keyframes caustic-drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(2%, -3%) scale(1.05); }
}

.grain {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: .08; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='1'/></svg>");
}

.bubbles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.bubble {
  position: absolute; bottom: -40px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.6), rgba(184,214,232,.18) 50%, transparent 70%);
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.25);
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translate(0, 0); opacity: 0; }
  10%  { opacity: .8; }
  90%  { opacity: .6; }
  100% { transform: translate(var(--drift,30px), -110vh); opacity: 0; }
}

/* ─── Layout primitives ─── */
.page { position: relative; z-index: 2; }
.container { max-width: 1440px; margin: 0 auto; padding: 0 48px; }

/* ─── Nav ─── */
.nav {
  position: sticky; top: 0; z-index: 50;
  padding: 22px 48px;
  display: flex; align-items: center; justify-content: space-between;
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  background: linear-gradient(180deg, rgba(3,8,20,.5), rgba(3,8,20,.15));
  border-bottom: .5px solid rgba(184,214,232,.08);
}
.brand {
  display: flex; align-items: baseline; gap: 10px;
  font-family: var(--serif); font-weight: 500; font-size: 26px;
  letter-spacing: .01em; font-style: italic;
}
.brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); display: inline-block; }
.brand small {
  font-family: var(--sans); font-size: 9px; font-weight: 600;
  font-style: normal; letter-spacing: .25em; text-transform: uppercase;
  color: var(--shallow); opacity: .7;
}
.nav-links { display: flex; gap: 36px; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.nav-links a { opacity: .8; transition: opacity .2s; }
.nav-links a:hover { opacity: 1; color: var(--foam); }
.nav-tools { display: flex; align-items: center; gap: 24px; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.cart-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 999px;
  border: .5px solid rgba(184,214,232,.2);
  transition: all .2s var(--ease);
}
.cart-btn:hover { border-color: var(--coral); background: rgba(233,163,115,.08); }
.cart-count {
  background: var(--coral); color: var(--abyss);
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
  letter-spacing: 0;
}

/* ─── Hero ─── */
.hero {
  min-height: 92vh;
  padding: 80px 48px 120px;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 60px;
  align-items: center;
  position: relative;
  max-width: 1440px; margin: 0 auto;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 12px;
  font-size: 11px; font-weight: 600; letter-spacing: .25em; text-transform: uppercase;
  color: var(--shallow);
  margin-bottom: 28px;
}
.hero-eyebrow::before { content: ""; width: 36px; height: 1px; background: var(--shallow); opacity: .5; }
.hero h1 {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(56px, 8vw, 124px);
  line-height: .92; letter-spacing: -.02em;
  color: var(--ivory);
}
.hero h1 em { font-style: italic; color: var(--coral); font-weight: 400; }
.hero h1 .thin { font-weight: 300; opacity: .85; }
.hero-sub {
  margin-top: 36px; max-width: 480px;
  font-size: 17px; line-height: 1.6; color: var(--foam); opacity: .85;
}
.hero-cta-row { margin-top: 44px; display: flex; align-items: center; gap: 20px; }

.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 16px 28px; border-radius: 999px;
  font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  transition: all .25s var(--ease);
  position: relative; overflow: hidden;
}
.btn-primary { background: var(--ivory); color: var(--abyss); }
.btn-primary:hover { background: var(--coral); color: var(--abyss); transform: translateY(-1px); }
.btn-ghost { border: .5px solid rgba(184,214,232,.3); color: var(--pearl); }
.btn-ghost:hover { border-color: var(--coral); color: var(--coral); }
.btn .arrow { transition: transform .25s var(--ease); }
.btn:hover .arrow { transform: translateX(4px); }

.hero-stats {
  margin-top: 80px;
  display: flex; gap: 56px;
  border-top: .5px solid rgba(184,214,232,.12);
  padding-top: 28px;
}
.stat .num { font-family: var(--serif); font-size: 36px; font-weight: 400; color: var(--ivory); }
.stat .lbl { font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--shallow); opacity: .75; margin-top: 4px; }

/* Hero visual — animated tank scene */
.hero-tank {
  position: relative; aspect-ratio: 3 / 4;
  border-radius: 4px; overflow: hidden;
  background: linear-gradient(180deg, rgba(53,111,179,.3) 0%, rgba(10,26,54,.85) 100%);
  border: .5px solid rgba(184,214,232,.18);
  box-shadow:
    inset 0 0 60px rgba(53,111,179,.3),
    inset 0 -40px 80px rgba(216,201,163,.08),
    0 30px 80px rgba(0,0,0,.5);
}
.hero-tank::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, transparent 40%);
  pointer-events: none;
}
.hero-tank-tag {
  position: absolute; top: 24px; left: 24px; z-index: 3;
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: var(--foam);
}
.hero-tank-tag .pulse {
  width: 8px; height: 8px; border-radius: 50%; background: var(--coral);
  box-shadow: 0 0 0 0 rgba(233,163,115,.6);
  animation: pulse 2s ease-out infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(233,163,115,.6); }
  100% { box-shadow: 0 0 0 14px rgba(233,163,115,0); }
}
.hero-tank-price {
  position: absolute; bottom: 24px; left: 24px; right: 24px; z-index: 3;
  display: flex; align-items: flex-end; justify-content: space-between;
}
.hero-tank-price .name { font-family: var(--serif); font-size: 28px; font-weight: 400; color: var(--ivory); }
.hero-tank-price .meta { font-size: 11px; color: var(--shallow); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.hero-tank-price .price { font-family: var(--serif); font-size: 34px; color: var(--coral); font-weight: 400; }

/* Fish & plants inside hero tank */
.tank-sand {
  position: absolute; bottom: 0; left: 0; right: 0; height: 14%;
  background: linear-gradient(180deg, rgba(216,201,163,.0), rgba(216,201,163,.35) 50%, rgba(168,148,98,.55));
  border-radius: 50% 50% 0 0 / 80% 80% 0 0;
}
.plant {
  position: absolute; bottom: 8%; transform-origin: bottom center;
  animation: sway 6s ease-in-out infinite;
}
.plant-1 { left: 12%; width: 32px; height: 38%; animation-duration: 7s; }
.plant-2 { right: 18%; width: 26px; height: 28%; animation-duration: 8s; animation-delay: -2s; }
.plant-3 { left: 60%; width: 22px; height: 22%; animation-duration: 9s; animation-delay: -1s; }
@keyframes sway {
  0%, 100% { transform: rotate(-3deg); }
  50%      { transform: rotate(3deg); }
}
.plant svg { width: 100%; height: 100%; }

.fish {
  position: absolute; pointer-events: none;
}
.fish-a { top: 30%; left: 0; width: 60px; animation: swim-a 22s linear infinite; }
.fish-b { top: 55%; right: 0; width: 44px; animation: swim-b 28s linear infinite; animation-delay: -8s; }
.fish-c { top: 18%; left: 0; width: 36px; animation: swim-a 35s linear infinite; animation-delay: -14s; }
@keyframes swim-a {
  0%   { transform: translateX(-20%) translateY(0); }
  45%  { transform: translateX(380%) translateY(-8px); }
  50%  { transform: translateX(380%) translateY(-8px) scaleX(-1); }
  95%  { transform: translateX(-20%) translateY(6px) scaleX(-1); }
  100% { transform: translateX(-20%) translateY(0); }
}
@keyframes swim-b {
  0%   { transform: translateX(20%) translateY(0) scaleX(-1); }
  45%  { transform: translateX(-420%) translateY(10px) scaleX(-1); }
  50%  { transform: translateX(-420%) translateY(10px); }
  95%  { transform: translateX(20%) translateY(-4px); }
  100% { transform: translateX(20%) translateY(0) scaleX(-1); }
}

/* ─── Marquee ticker ─── */
.ticker {
  border-top: .5px solid rgba(184,214,232,.12);
  border-bottom: .5px solid rgba(184,214,232,.12);
  overflow: hidden;
  padding: 18px 0;
  font-family: var(--serif); font-style: italic;
  font-size: 22px; color: var(--foam);
}
.ticker-track { display: flex; gap: 60px; white-space: nowrap; animation: ticker 40s linear infinite; }
.ticker-track span { display: inline-flex; align-items: center; gap: 60px; }
.ticker-track .sep { color: var(--coral); }
@keyframes ticker {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ─── Section heading ─── */
.section { padding: 120px 48px; max-width: 1440px; margin: 0 auto; position: relative; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 64px; gap: 40px; }
.section-eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .25em; text-transform: uppercase;
  color: var(--shallow); display: flex; align-items: center; gap: 12px;
}
.section-eyebrow::before { content: ""; width: 36px; height: 1px; background: var(--shallow); opacity: .5; }
.section-head h2 {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(40px, 5vw, 72px); line-height: 1; letter-spacing: -.015em;
  color: var(--ivory); margin-top: 14px;
}
.section-head h2 em { font-style: italic; color: var(--coral); font-weight: 400; }
.section-head .desc { max-width: 380px; font-size: 15px; color: var(--foam); opacity: .8; line-height: 1.6; }

/* ─── Category grid ─── */
.cat-grid {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px;
}
.cat-card {
  position: relative; aspect-ratio: 3 / 4;
  border-radius: 2px; overflow: hidden;
  border: .5px solid rgba(184,214,232,.12);
  background: linear-gradient(180deg, rgba(29,64,120,.3), rgba(6,18,38,.6));
  cursor: pointer; transition: all .35s var(--ease);
}
.cat-card:hover { transform: translateY(-4px); border-color: rgba(233,163,115,.4); }
.cat-card-glyph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: .35; transition: opacity .35s var(--ease);
}
.cat-card:hover .cat-card-glyph { opacity: .7; }
.cat-card-glyph svg { width: 64%; height: 64%; color: var(--shallow); }
.cat-card-info {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 16px;
  background: linear-gradient(180deg, transparent, rgba(3,8,20,.7));
}
.cat-card-num {
  font-family: var(--mono); font-size: 10px; letter-spacing: .15em; color: var(--coral);
}
.cat-card-name {
  font-family: var(--serif); font-size: 22px; font-weight: 400; color: var(--ivory); margin-top: 4px;
}
.cat-card-meta { font-size: 11px; color: var(--shallow); margin-top: 2px; opacity: .8; }

/* ─── Featured products ─── */
.products {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
}
.product {
  display: flex; flex-direction: column;
  position: relative;
}
.product-img {
  position: relative; aspect-ratio: 4 / 5;
  border-radius: 2px; overflow: hidden;
  background: linear-gradient(180deg, rgba(53,111,179,.18), rgba(10,26,54,.6));
  border: .5px solid rgba(184,214,232,.1);
  margin-bottom: 16px;
  transition: all .3s var(--ease);
}
.product-img::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.05) 0%, transparent 30%);
  pointer-events: none;
}
.product:hover .product-img { border-color: rgba(233,163,115,.3); }
.product-badge {
  position: absolute; top: 12px; left: 12px;
  font-size: 9px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 999px;
  background: var(--coral); color: var(--abyss);
  z-index: 2;
}
.product-badge.live { background: var(--kelp); color: var(--ivory); }
.product-badge.new { background: var(--ivory); color: var(--abyss); }
.product-glyph {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  opacity: .5;
}
.product-glyph svg { width: 70%; height: 70%; color: var(--foam); }
.product-add {
  position: absolute; bottom: 12px; right: 12px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--ivory); color: var(--abyss);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: translateY(8px);
  transition: all .25s var(--ease);
  z-index: 3;
}
.product:hover .product-add { opacity: 1; transform: translateY(0); }
.product-add:hover { background: var(--coral); transform: scale(1.06); }
.product-add.added { background: var(--kelp); color: var(--ivory); opacity: 1; transform: translateY(0); }

.product-info { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.product-name { font-family: var(--serif); font-size: 22px; font-weight: 400; color: var(--ivory); line-height: 1.1; }
.product-meta { font-size: 12px; color: var(--shallow); margin-top: 4px; letter-spacing: .04em; }
.product-price { font-family: var(--serif); font-size: 22px; color: var(--coral); white-space: nowrap; }

/* ─── Filter chips ─── */
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chip {
  padding: 9px 18px; border-radius: 999px;
  border: .5px solid rgba(184,214,232,.2);
  font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--foam); transition: all .2s var(--ease);
}
.chip:hover { border-color: var(--shallow); color: var(--ivory); }
.chip.active { background: var(--ivory); color: var(--abyss); border-color: var(--ivory); }

/* ─── Setup bundle cards ─── */
.bundles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.bundle {
  position: relative;
  border: .5px solid rgba(184,214,232,.15);
  background: linear-gradient(180deg, rgba(29,64,120,.18), rgba(6,18,38,.4));
  padding: 36px 32px 32px;
  border-radius: 2px;
  display: flex; flex-direction: column;
  min-height: 460px;
  transition: all .3s var(--ease);
}
.bundle:hover { border-color: rgba(233,163,115,.35); transform: translateY(-3px); }
.bundle.featured { border-color: var(--coral); background: linear-gradient(180deg, rgba(233,163,115,.08), rgba(6,18,38,.4)); }
.bundle-tag { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; color: var(--coral); margin-bottom: 12px; }
.bundle-name { font-family: var(--serif); font-size: 36px; font-weight: 400; color: var(--ivory); line-height: 1; }
.bundle-name em { font-style: italic; }
.bundle-tagline { font-size: 14px; color: var(--foam); opacity: .85; margin-top: 12px; line-height: 1.5; }
.bundle-inc { margin-top: 24px; padding-top: 20px; border-top: .5px solid rgba(184,214,232,.1); display: flex; flex-direction: column; gap: 10px; flex: 1; }
.bundle-inc li {
  list-style: none; display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--foam);
}
.bundle-inc li::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--coral); flex-shrink: 0;
}
.bundle-foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: 24px; padding-top: 20px; border-top: .5px solid rgba(184,214,232,.1); }
.bundle-foot .price { font-family: var(--serif); font-size: 32px; color: var(--ivory); }
.bundle-foot .price small { font-family: var(--sans); font-size: 11px; color: var(--shallow); letter-spacing: .1em; text-transform: uppercase; margin-left: 4px; }

/* ─── Care strip ─── */
.care-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  border-top: .5px solid rgba(184,214,232,.12);
  border-bottom: .5px solid rgba(184,214,232,.12);
}
.care-strip > div {
  padding: 36px 28px;
  border-right: .5px solid rgba(184,214,232,.12);
}
.care-strip > div:last-child { border-right: none; }
.care-strip .num { font-family: var(--mono); font-size: 11px; color: var(--coral); letter-spacing: .15em; }
.care-strip .ttl { font-family: var(--serif); font-size: 22px; font-weight: 400; color: var(--ivory); margin-top: 10px; }
.care-strip .sub { font-size: 13px; color: var(--foam); opacity: .8; margin-top: 8px; line-height: 1.5; }

/* ─── Newsletter ─── */
.newsletter {
  padding: 140px 48px;
  text-align: center;
  max-width: 760px; margin: 0 auto;
}
.newsletter h2 {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(40px, 5vw, 64px); line-height: 1; letter-spacing: -.01em;
  color: var(--ivory);
}
.newsletter h2 em { font-style: italic; color: var(--coral); font-weight: 400; }
.newsletter p { margin-top: 20px; color: var(--foam); opacity: .85; font-size: 16px; }
.news-form {
  margin-top: 36px;
  display: flex; gap: 8px;
  background: rgba(184,214,232,.06);
  border: .5px solid rgba(184,214,232,.18);
  border-radius: 999px;
  padding: 6px 6px 6px 24px;
  max-width: 480px; margin-left: auto; margin-right: auto;
}
.news-form input {
  flex: 1; background: transparent; border: 0; outline: none;
  font: inherit; color: var(--ivory);
}
.news-form input::placeholder { color: var(--shallow); opacity: .7; }
.news-form button {
  padding: 12px 22px; border-radius: 999px;
  background: var(--ivory); color: var(--abyss);
  font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  transition: all .2s;
}
.news-form button:hover { background: var(--coral); }

/* ─── Footer ─── */
.foot {
  padding: 80px 48px 40px;
  border-top: .5px solid rgba(184,214,232,.1);
  max-width: 1440px; margin: 0 auto;
}

.cart-item-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
.cart-item-price { font-family: var(--serif); font-size: 18px; color: var(--coral); }
.cart-item-remove { font-size: 11px; color: var(--shallow); letter-spacing: .1em; text-transform: uppercase; transition: color .15s; }

.cart-foot { padding: 22px 28px 28px; border-top: .5px solid rgba(184,214,232,.12); background: rgba(3,8,20,.4); }

  position: relative;

  animation: pulse-ring 2.4s ease-out infinite;

  100% { transform: scale(1.4); opacity: 0; }

.live-dot {

/* ─── Toast ─── */
.toast {

        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={() => setOpen(false)}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio" aria-checked={on} data-on={on ? '1' : '0'}
                    style={{ background: hero }} onClick={() => onChange(o)}>
              {sup.length > 0 && <span>{sup.map((c, j) => <i key={j} style={{ background: c }} />)}</span>}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function useCart() {
  const [items, setItems] = useState([]);
  const [open, setOpen] = useState(false);
  const add = (product, qty = 1) => {
    setItems(prev => {
      const found = prev.find(i => i.id === product.id);
      if (found) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + qty } : i);
      return [...prev, { ...product, qty }];
    });
  };
  const remove = (id) => setItems(prev => prev.filter(i => i.id !== id));
  const setQty = (id, qty) => { if (qty <= 0) return remove(id); setItems(prev => prev.map(i => i.id === id ? { ...i, qty } : i)); };
  const clear = () => setItems([]);
  const count = items.reduce((s, i) => s + i.qty, 0);
  const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
  return { items, open, setOpen, add, remove, setQty, clear, count, subtotal };
}

function ProductCard({ product, onAdd }) {
  const [added, setAdded] = useState(false);
  const handle = (e) => {
    e.stopPropagation();
    onAdd(product);
    setAdded(true);
    setTimeout(() => setAdded(false), 1200);
  };
  return (
    <div className="product">
      <div className="product-img">
        {product.badge === "new"  && <div className="product-badge new">New</div>}
        {product.badge === "live" && <div className="product-badge live"><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span className="live-dot" style={{background:"var(--ivory)"}} />Live</span></div>}
        <div className="product-glyph"><Glyph name={product.glyph} /></div>
        <button className={"product-add" + (added ? " added" : "")} onClick={handle} aria-label={`Add ${product.name} to cart`}>
          {added ? <Glyph name="check" /> : <Glyph name="plus" />}
        </button>
      </div>
      <div className="product-info">
        <div>
          <div className="product-name">{product.name}</div>
          <div className="product-meta">{product.meta}</div>
        </div>
        <div className="product-price">${product.price}</div>
      </div>
    </div>
  );
}
